<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Aircraft | GlobalWings Control</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (via PostCSS/CLI) -->
    <link rel="stylesheet" href="css/index.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logos/logo.svg" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-sky-deep font-inter text-sky-main py-12">
    <div class="container mx-auto px-4 max-w-3xl">
      <a href="/" class="header-back-sky">
        <i class="bi bi-arrow-left mr-2"></i> Back to Fleet
      </a>

      <div class="form-glass">
        <div class="mb-8">
          <h2 class="text-4xl font-black font-syne mb-2 text-white">Register Aircraft</h2>
          <p class="text-sky-dim">
            Integrate a new platform into the GlobalWings strategic database.
          </p>
        </div>

        <form
          id="aircraftForm"
          action="/api/aircraft"
          method="POST"
          class="space-y-6"
        >
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="name" class="form-label-sky">Aircraft Name</label>
              <input
                type="text"
                class="form-input-sky"
                id="name"
                name="name"
                placeholder="e.g. F-35 Lightning II"
                required
              />
            </div>

            <div>
              <label for="model" class="form-label-sky">Manufacturer</label>
              <input
                type="text"
                class="form-input-sky"
                id="model"
                name="model"
                placeholder="e.g. Lockheed Martin"
                required
              />
            </div>

            <div>
              <label for="country" class="form-label-sky">Country Registry</label>
              <select
                class="form-input-sky appearance-none"
                id="country"
                name="country_id"
                required
              >
                <option value="" disabled selected>Select region</option>
                <option value="1">USA</option>
                <option value="2">Russia</option>
                <option value="3">China</option>
                <option value="4">India</option>
                <option value="5">France</option>
                <option value="6">UK</option>
              </select>
            </div>

            <div>
              <label for="type" class="form-label-sky">Operational Type</label>
              <select class="form-input-sky appearance-none" id="type" name="type_id" required>
                <option value="" disabled selected>Select category</option>
                <option value="1">Fighter</option>
                <option value="2">Transport</option>
                <option value="3">Bomber</option>
                <option value="4">Reconnaissance</option>
                <option value="5">Trainer</option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label for="model_path" class="form-label-sky"
                >3D Model Package (.glb)</label
              >
              <select
                class="form-input-sky appearance-none"
                id="model_path"
                name="model_path"
                required
              >
                <option value="/models/2.glb">
                  F-22 Advanced Package (2.glb)
                </option>
                <option value="/models/sukhoi_su-57.glb">
                  Su-57 Stealth Package
                </option>
                <option value="/models/hal_tejas.glb">Tejas LCA Package</option>
                <option value="/models/3.glb">Multi-role Package 3</option>
                <option value="/models/4.glb">Multi-role Package 4</option>
                <option value="/models/5.glb">Multi-role Package 5</option>
              </select>
            </div>

            <div>
              <label for="speed" class="form-label-sky">Max Speed (km/h)</label>
              <input
                type="number"
                class="form-input-sky"
                id="speed"
                name="speed"
                placeholder="2500"
                required
              />
            </div>

            <div>
              <label for="range" class="form-label-sky">Range (km)</label>
              <input
                type="number"
                class="form-input-sky"
                id="range"
                name="_range"
                placeholder="3200"
                required
              />
            </div>

            <div>
              <label for="fuel_capacity" class="form-label-sky">Fuel (L)</label>
              <input
                type="number"
                class="form-input-sky"
                id="fuel_capacity"
                name="fuel_capacity"
                placeholder="8000"
                required
              />
            </div>

            <div>
              <label for="weight" class="form-label-sky">Weight (kg)</label>
              <input
                type="number"
                class="form-input-sky"
                id="weight"
                name="weight"
                placeholder="18000"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit-sky">
            Initialize Registration
          </button>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/validate_add.js"></script>
  </body>
</html>
  </body>
</html>
