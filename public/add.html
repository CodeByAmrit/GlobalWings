<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Aircraft | GlobalWings Control</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/index.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logos/logos.svg" />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      .form-glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      }

      .form-label {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        color: #94a3b8;
        margin-bottom: 0.5rem;
      }

      .form-control,
      .form-select {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white !important;
        border-radius: 12px;
        padding: 0.75rem 1rem;
      }

      .form-control:focus,
      .form-select:focus {
        background: rgba(0, 0, 0, 0.3);
        border-color: #3b82f6;
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
      }

      .btn-submit {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 1rem;
        border-radius: 12px;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        font-size: 1.1rem;
        transition: 0.3s;
        margin-top: 1rem;
      }

      .btn-submit:hover {
        background: #2563eb;
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
      }

      .header-back {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: #3b82f6;
        font-weight: 600;
        margin-bottom: 2rem;
      }
    </style>
  </head>

  <body class="bg-main text-white py-5">
    <div class="container" style="max-width: 800px">
      <a href="/" class="header-back">
        <i class="bi bi-arrow-left me-2"></i> Back to Fleet
      </a>

      <div class="form-glass">
        <div class="mb-4">
          <h2 class="display-6 fw-bold outfit-font mb-2">Register Aircraft</h2>
          <p class="text-secondary">
            Integrate a new platform into the GlobalWings strategic database.
          </p>
        </div>

        <form
          id="aircraftForm"
          action="/api/aircraft"
          method="POST"
          class="needs-validation"
          novalidate
        >
          <div class="row g-4">
            <div class="col-md-6">
              <label for="name" class="form-label">Aircraft Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="e.g. F-35 Lightning II"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="model" class="form-label">Manufacturer</label>
              <input
                type="text"
                class="form-control"
                id="model"
                name="model"
                placeholder="e.g. Lockheed Martin"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="country" class="form-label">Country Registry</label>
              <select
                class="form-select"
                id="country"
                name="country_id"
                required
              >
                <option value="" disabled selected>Select region</option>
                <option value="1">USA</option>
                <option value="2">Russia</option>
                <option value="3">China</option>
                <option value="4">India</option>
                <option value="5">France</option>
                <option value="6">UK</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="type" class="form-label">Operational Type</label>
              <select class="form-select" id="type" name="type_id" required>
                <option value="" disabled selected>Select category</option>
                <option value="1">Fighter</option>
                <option value="2">Transport</option>
                <option value="3">Bomber</option>
                <option value="4">Reconnaissance</option>
                <option value="5">Trainer</option>
              </select>
            </div>

            <div class="col-md-12">
              <label for="model_path" class="form-label"
                >3D Model Package (.glb)</label
              >
              <select
                class="form-select"
                id="model_path"
                name="model_path"
                required
              >
                <option value="/models/2.glb">
                  F-22 Advanced Package (2.glb)
                </option>
                <option value="/models/sukhoi_su-57.glb">
                  Su-57 Stealth Package
                </option>
                <option value="/models/hal_tejas.glb">Tejas LCA Package</option>
                <option value="/models/3.glb">Multi-role Package 3</option>
                <option value="/models/4.glb">Multi-role Package 4</option>
                <option value="/models/5.glb">Multi-role Package 5</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="speed" class="form-label">Max Speed (km/h)</label>
              <input
                type="number"
                class="form-control"
                id="speed"
                name="speed"
                placeholder="2500"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="range" class="form-label">Range (km)</label>
              <input
                type="number"
                class="form-control"
                id="range"
                name="_range"
                placeholder="3200"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="fuel_capacity" class="form-label">Fuel (L)</label>
              <input
                type="number"
                class="form-control"
                id="fuel_capacity"
                name="fuel_capacity"
                placeholder="8000"
                required
              />
            </div>

            <div class="col-md-6">
              <label for="weight" class="form-label">Weight (kg)</label>
              <input
                type="number"
                class="form-control"
                id="weight"
                name="weight"
                placeholder="18000"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-submit w-100">
            Initialize Registration
          </button>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/validate_add.js"></script>
  </body>
</html>
